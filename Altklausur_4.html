<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK-QUIZ</title>
    <style>
        :root {
            --bg-color: #0b0716;
            --panel-bg: #15102a;
            --neon-pink: #ff2a85;
            --neon-purple: #b537f2;
            --neon-cyan: #00f0ff;
            --neon-green: #00ffaa;
            --neon-red: #ff3366;
            --text-main: #f3f0ff;
            --border-glow: 0 0 15px rgba(181, 55, 242, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at 10% 20%, rgba(181, 55, 242, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 42, 133, 0.1) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 2px solid rgba(181, 55, 242, 0.4);
            box-shadow: var(--border-glow);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .question-meta {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 18px;
            line-height: 1.5;
            color: #fff;
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(25, 18, 48, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--neon-purple);
            background: rgba(181, 55, 242, 0.1);
        }

        .option-btn.selected {
            background: rgba(181, 55, 242, 0.2);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.2);
        }

        /* Feedback Zustände nach Überprüfung */
        .option-btn.correct-ans {
            background: rgba(0, 255, 170, 0.15) !important;
            border-color: var(--neon-green) !important;
            color: #afffdf !important;
        }

        .option-btn.wrong-ans {
            background: rgba(255, 51, 102, 0.15) !important;
            border-color: var(--neon-red) !important;
            color: #ffb3c6 !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border: none;
            color: #fff;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 42, 133, 0.3);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.5);
        }

        .explanation {
            font-size: 0.85rem;
            background: rgba(10, 5, 20, 0.5);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 0 8px 8px 0;
            padding: 12px;
            margin-bottom: 15px;
            color: #d8d4fc;
            line-height: 1.4;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
        }

        .result-score {
            font-size: 2.8rem;
            margin: 15px 0;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .result-status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.4);
        }

        .failed {
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Jenny´s AK-QUIZ</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </header>

    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 15px;">
            Bereit für deine Lernsession?<br>Altklausur AFC SoSe 25.
        </div>
        <p style="font-size: 0.85rem; text-align: center; margin-bottom: 30px; color: #a59fc8; line-height: 1.4;">
            <br>Bestanden ab 75% korrekten Antworten.
        </p>
        <button class="cyber-btn" onclick="startQuiz()">Lernen starten</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
        <div class="question-meta" id="questionCounter">Frage 1 / 40</div>
        <div class="question-text" id="questionText">Lade Frage...</div>
        <div class="options-list" id="optionsList"></div>
        <div class="explanation" id="explanationBox"></div>
        <button class="cyber-btn" id="actionBtn" onclick="handleAction()">Antworten prüfen</button>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen">
        <div class="result-box">
            <h2 style="color: var(--text-main); font-weight: 600;">Auswertung</h2>
            <div class="result-score" id="resultScore">0%</div>
            <div class="result-status" id="resultStatus">Status</div>
            <p id="resultDetails" style="font-size: 0.9rem; margin-bottom: 25px; color: #b8b2e2; line-height: 1.4;"></p>
            <button class="cyber-btn" onclick="restartQuiz()">Nochmal lernen</button>
        </div>
    </div>
</div>

<script>
    const questions = [
  {
    "frage": "Sharon, eine Anwohnerin, überlegt, sich einer Initiative lokaler Bürger*innen anzuschließen, die eine alte Eiche in ihrem Viertel vor der Fällung bewahren will. Sie macht sich verschiedene Gedanken über ihr mögliches Engagement. Welche der folgenden Aussagen ordnen Sharons Überlegungen korrekt den im Studienbrief beschriebenen Konzepten der Wirksamkeitserwartung zu? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Sharons Gedanke \"Ich habe doch gar keine Ahnung, wie man eine Petition formuliert oder eine Protestaktion organisiert\" drückt eine geringe Ausprägung einer kollektiven Wirksamkeitserwartung aus.",
    "b": "Sharon hat mit der Initiative, die Eiche vor der Fällung zu bewahren, Erfolg. Daher ist zu erwarten, dass sie auch glaubt, die Gruppe werde die Arbeitslosigkeit in ihrem Viertel erfolgreich bekämpfen.",
    "c": "Die Überzeugung \"Selbst wenn ich mitmache, interessiert das die da oben im Rathaus doch sowieso nicht\" zeigt eine geringe Ausprägung ihrer individuellen politischen Wirksamkeitserwartung.",
    "d": "Kollektive Wirksamkeitserwartung könnte laut Literatur entweder die Wirksamkeit, die Bürger*innen der Initiative in Summe erwarten, beschreiben, oder auch Sharons individuelle Erwartung davon, welche Wirkung die Gruppe erzielen kann.",
    "e": "Wenn Sharon eine hohe individuelle politische Wirksamkeitserwartung hat, lässt sich davon ableiten, dass sie auch im beruflichen Kontext eine hohe Wirksamkeitserwartung hat.",
    "richtig": "c, d",
    "begruendung": ":-)"
  },
  {
    "frage": "Welche der folgenden Aussagen zur Beteiligung von Bürger*innen (Citizen Participation) sind korrekt? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Eine wichtige Zieldimension der Citizen Participation ist die Klärung von Konflikten innerhalb der bestehenden lokalen Community.",
    "b": "Eine wichtige Zieldimension der Citizen Participation ist die gemeinsame Suche, Entwicklung und Realisierung von Lösungen für gemeinsame Probleme der Bürger*innen.",
    "c": "Im Rahmen von Planungsverfahren werden zwei Arten von Beteiligungsverfahren unterschieden: zum einen gesetzlich vorgeschriebene und zum anderen freiwillige Beteiligungsverfahren.",
    "d": "Citizen Participation spielt in der Quartiersentwicklung eine zentrale Rolle.",
    "e": "Ein zentrales Anliegen der Citizen Participation ist die Selbstbefähigung bzw. Bevollmächtigung aller individuellen Mitglieder einer Community.",
    "richtig": "a, b, c, d",
    "begruendung": "Lt. Klausur ist Antwort E - Richtig und Falsch"
  },
  {
    "frage": "In einem einkommensschwachen Stadtteil plant die Stadtverwaltung den Bau eines Luxus-Einkaufszentrums, wofür mehrere bewohnte Häuser abgerissen werden sollen. Eine Initiative lokaler Bürger*innen wehrt sich dagegen. Die Stadtverwaltung nutzt verschiedene Strategien, um das Projekt gegen den Willen vieler Anwohner*innen durchzusetzen. Welche der folgenden Aussagen bewerten die Strategien der Stadtverwaltung korrekt anhand der im Studienbrief beschriebenen Mechanismen von Machtausübung und Empowerment? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Das Vorhaben der Stadtverwaltung kann nicht als Machtausübung verstanden werden, da sich der Machtbegriff auf Befähigungen von Einzelpersonen oder sozialen Gruppen bezieht, aber nicht von Institutionen bezieht.",
    "b": "Einem lokalen Sportverein, der sich der Initiative angeschlossen hat, wird plötzlich von der Stadtverwaltung mitgeteilt, dass seine beantragten Fördergelder für das nächste Jahr \"neu bewertet\" werden müssen. Die Kürzung der Fördergelder könnte als eine Form der Machtausübung durch Sanktionierung interpretiert werden.",
    "c": "Die entscheidende Anhörung von Bürger*innen zum Bauprojekt wird von der Verwaltung ohne vorherige Rücksprache auf einen Dienstagvormittag um 10:00 Uhr angesetzt. Dies kann als Machtausübung durch Kontrolle von Prozeduren interpretiert werden.",
    "d": "Die Stadtverwaltung startet eine Medienkampagne, in der das Projekt als \"dringend notwendige Aufwertung des Quartiers\" und optimal zur \"Schaffung von Arbeitsplätzen\" dargestellt wird, ohne die Verdrängung der Anwohner*innen zu thematisieren. Dies ist ein Beispiel für Machtausübung durch „Framing“.",
    "e": "Eine Möglichkeit des Empowerments der Bürger*innen, die sich in der Ortsinitiative engagieren, bestünde darin, sich mit ähnlichen Initiativen an anderen Orten zu vernetzen und Kooperationen mit diesen zu etablieren.",
    "richtig": "b, c, d",
    "begruendung": "Lt. Klausur ist Antwort E - Richtig und Falsch"
  },
  {
    "frage": "Welche Aussagen zum Ablehnungs-Identifikationsmodell von Branscombe et al. (1999) sind korrekt? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Dem Modell zufolge reduziert die Wahrnehmung kollektiver Diskriminierung die Identifikation mit der Eigengruppe.",
    "b": "Das Modell postuliert einen indirekten positiven Effekt der Wahrnehmung von Diskriminierung auf das Wohlbefinden.",
    "c": "Dem Modell zufolge wirkt sich die Wahrnehmung relativ andauernder Diskriminierung der Eigengruppe negativ auf das psychosoziale Wohlbefinden der Mitglieder der Eigengruppe aus.",
    "d": "Dem Modell zufolge wirkt sich die Identifikation mit der Eigengruppe positiv auf das psychosoziale Wohlbefinden aus.",
    "e": "Das Modell basiert auf der Annahme einer Erhöhung der negativen psychologischen Konsequenzen bei wahrgenommener Diskriminierung aufgrund der kollektiven Identifikation mit der abgewerteten Eigengruppe.",
    "richtig": "b, c, d",
    "begruendung": ":-)"
  },
  {
    "frage": "Welche Aussagen zu den sozial-ökologischen Prinzipien (Kelly, 2006; Tricket et al., 1972) sind korrekt? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Sozialsysteme bestehen aus vornehmlich unabhängigen Teilsystemen.",
    "b": "Der Einflussprozess, den eine Gruppe auf ein neues Mitglied im Sinne der Anpassung an die Normen der Gruppe ausübt, nennt man Akkommodation.",
    "c": "Das Prinzip der Sukzession befasst sich mit Transaktionsprozessen wie zum Beispiel der Assimilation.",
    "d": "Ein Local-Exchange Changing System (LECS) ist ein formalisiertes System des Ressourcenaustausches.",
    "e": "Communities sind sozial interdependente Systeme, die sowohl von Systemen auf der gleichen als auch auf einer anderen ökologischen Ebene beeinflusst werden können.",
    "richtig": "e",
    "begruendung": ":-)"
  },
  {
    "frage": "Welche der folgenden Interventionsmaßnahmen zur Förderung von aktiver Partizipation setzen at Prozessen der zweiten Stufe des Modells von Klandermans (1997) an? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Frustrationsimpfung",
    "b": "Setzung individueller Anreize",
    "c": "Triangulation",
    "d": "Aufbau und Stärkung von Netzwerken",
    "e": "Bewusstseinsbildung",
    "richtig": "c, d",
    "begruendung": ":-)"
  },
  {
    "frage": "Die Gründung der Community Psychology entstand aus der Kritik an der bestehenden akademischen Psychologie und zielte auf einen Paradigmenwechsel ab. Welche der folgenden Antworten beschreiben diese damals gewünschte Veränderung des Selbstverständnisses der Psychologie? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "In Forschung und Praxis sollte der soziale Kontext stärker berücksichtigt werden.",
    "b": "Es sollte vermehrt ein Fokus auf individualtherapeutische Interventionen gelegt werden.",
    "c": "Die bisher als wissenschaftlich überlegen geltenden quantitativen Methoden sollten so weit wie möglich durch qualitative Ansätze ersetzt werden.",
    "d": "Die Lösung individueller und sozialer Probleme anhand psychologischer Methoden sollte als wichtiger eingestuft werden als die Erforschung von Ursachen dieser Probleme.",
    "e": "Die Psychologie sollte Faktoren auf verschiedenen Ebenen (wie interpersonale oder politische Prozesse) in die Analyse mit einbeziehen.",
    "richtig": "a, e",
    "begruendung": ":-)"
  },
  {
    "frage": "Welche der folgenden Aussagen zur community-psychologischen Perspektive auf Communities sind korrekt? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Eine Gruppe von Personen, die jeden Morgen mit der gleichen S-Bahn zur Arbeit fahren, stellt eine sozial-relationale Community dar.",
    "b": "Die Bewohner*innen der Stadt Gelsenkirchen bilden eine lokal-administrative Community.",
    "c": "Ein internationaler Online-Fanclub der Band „Enter Shikari“, dessen Mitglieder regelmäßig über Foren interagieren, kann als sozial-relationale Community verstanden werden.",
    "d": "Eine Kleinfamilie ist laut Definition im Studienbrief das prototypische Beispiel für eine Community im community-psychologischen Sinne.",
    "e": "Die Identität und die Werte einer Community werden ausschließlich durch interne Aushandlungsprozesse der Mitglieder festgelegt.",
    "richtig": "b, c",
    "begruendung": ":-)"
  },
  {
    "frage": "Welche Aussagen zum Begriff der psychopolitischen Validität im Sinne Prilleltenskys (2003) sind korrekt? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Psychopolitische Validität misst, wie stark politische Institutionen in die Ergebniserstellung involviert sind.",
    "b": "Psychopolitische Validität misst unter anderem, ob der Einfluss politischer oder ökonomischer Faktoren auf Individuen in einer Studie thematisiert und untersucht wurde.",
    "c": "Psychopolitische Validität misst unter anderem, ob Community Mitglieder durch die Forschungsteilnahme den Einfluss von Makrofaktoren auf das eigene Leben verstehen.",
    "d": "Psychopolitische Validität ist das methodologische Hauptgütekriterium community-psychologischer Forschung.",
    "e": "Psychopolitische Validität erfordert eine frühzeitige Auseinandersetzung damit, wie die gewonnenen Erkenntnisse verwertet werden können.",
    "richtig": "b, c, e",
    "begruendung": ":-)"
  },
  {
    "frage": "Sozialwissenschaftliche Befunde werden in politischen Kontexten interpretiert und bewertet. Welche potentiellen Problematiken des Konzepts des Sense of Community sind in diesem Zusammenhang thematisiert worden (u. a. von Sarason, 1974)? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Die Verbindung des Begriffs zu Newbroughs Entwurf der „gerechten Community“",
    "b": "Der mangelnde heuristische Wert des Konzepts für die sozialwissenschaftliche Forschung",
    "c": "Die Instrumentalisierung des Begriffs zur Durchsetzung von Majoritätsinteressen zu Lasten von Minoritäten und Pluralismus",
    "d": "Die ideologische Aufgeladenheit des Begriffs im Sinne eines sozialen Determinismus",
    "e": "Die Verwechslung von individueller und kollektiver Ebene des Konzepts",
    "richtig": "c",
    "begruendung": "Lt. Klausur ist Antwort e - Richtig und Falsch"
  },
  {
    "frage": "Welche der folgenden Beispiele beschreiben Faktoren und/oder Prozesse, die in dem sozial-ökologischen Mehrebenenansatz nach Bronfenbrenner (1979) berücksichtigt werden? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Auswirkungen von Arbeitsbedingungen auf die Beziehungsqualität zwischen Eltern und Kindern",
    "b": "Einflüsse von globalen Klimaveränderungen auf die Migration von Familien",
    "c": "Vergleiche individueller körperlicher Stressreaktionen",
    "d": "Wechselwirkungen zwischen schulischen Richtlinien und dem Verhalten von Schüler*innen",
    "e": "Veränderungen des neuronalen Netzwerkes durch genetische Mutationen",
    "richtig": "a, b, d",
    "begruendung": ":-)"
  },
  {
    "frage": "Ein Team von Psycholog*innen untersucht die im Vergleich zu anderen Schulen hohe Schulabbruchquote an einer Gesamtschule in einem sozioökonomisch benachteiligten Stadtteil. Das Team stellt fest, dass viele der betroffenen Schülerinnen einen Migrationshintergrund haben. In ihrem Bericht führt das Team die hohe Abbruchquote auf \"kulturell bedingte Defizite in der elterlichen Bildungsorientierung\" zurück. Welche der folgenden Aussagen bewerten diesen Befund korrekt aus einer Perspektive des context minimization error (Shinn & Toohey, 2003)? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Die Bewertung der Situation durch das Team unterliegt dem context minimization error, da das Team den Einfluss des sozialen Kontexts, wie die sozioökonomische Lage des Viertels oder fehlende Freizeitangebote, in der Analyse vernachlässigt.",
    "b": "Eine Untersuchung zum Sozialklima an der Schule hätte dazu beitragen können, den context minimization error zu vermeiden.",
    "c": "Der context minimization error ist dadurch zustande gekommen, dass die Schulabbruchquote mit anderen Schulen verglichen wurde.",
    "d": "Ein Ansatz, der stattdessen ausschließlich die Persönlichkeitsmerkmale der einzelnen Schülerinnen untersucht hätte, wäre vorzuziehen.",
    "e": "Der context minimization error wäre in jedem Fall vermieden worden, wenn das Team interdisziplinär gearbeitet hätte.",
    "richtig": "a, b",
    "begruendung": ":-)"
  },
  {
    "frage": "Welche der folgenden Charakteristika stellen nach der Familiensystemtheorie (Schneewind, 2009) wichtige Systemmerkmale von Familien dar? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Homöostase und damit ein Gleichgewichtszustand innerhalb der Familie",
    "b": "Zielorientierung der Familie",
    "c": "Kommunikationsmuster",
    "d": "Kollektive Wirksamkeit",
    "e": "Zirkuläre Kausalität",
    "richtig": "a, b, c, e",
    "begruendung": ":-)"
  },
  {
    "frage": "Eine Gruppe von Schüler*innen mit Migrationshintergrund erlebt wiederholt, dass sie von Mitschüler*innen ohne Migrationshintergrund ausgegrenzt werden. Sie werden ebenfalls bei gleicher Leistung im Vergleich zu Mitschüler*innen ohne Migrationshintergrund von Lehrkräften schlechter benotet. Als Reaktion darauf nennen sie sich selbst die „East-End-Crew“, tragen ähnliche Kleidung und verbringen die Pausen nur noch unter sich. Welche der folgenden Aussagen zu diesem Verhalten sind laut sozialpsychologischer Forschung zur kollektiven Identifikation als Copingstrategie korrekt? Wählen Sie für alle Aussagen entweder ‚Richtig‘ oder ‚Falsch‘.",
    "a": "Die verstärkte Identifikation mit der Eigengruppe (\"East-End-Crew\") ist eine erwartbare Reaktion auf die Wahrnehmung von kollektiver Diskriminierung.",
    "b": "Aus Sicht des sozialen Identitätsansatzes ist die stärkere Gruppenbildung primär ein Zeichen für mangelnden Integrationswillen der Jugendlichen.",
    "c": "Diese Reaktion ist erwartbar, weil ein Wechsel in die privilegierte Gruppe für die Jugendlichen möglich wäre.",
    "d": "Die Stärke der Identifikation mit der \"East-End-Crew\" hängt mit dem Bedürfnis nach einem positiven Selbstbild zusammen, das durch die Ausgrenzungserfahrungen bedroht wurde.",
    "e": "Da Coping keine kollektive, sondern individuelle Stressbewältigung beschreibt, kann die kollektive Identifikation als \"East-End-Crew\" nicht als Coping-Strategie verstanden werden.",
    "richtig": "a, d",
    "begruendung": ":-)"

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        // Buttons sperren und Auswertung anzeigen
        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                // Wenn richtig angekreuzt wurde, geben wir einen Punkt dazu
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        // Begründung anzeigen
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        // Button-Text auf "Weiter" ändern
        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

        currentQuestionIndex++;

            loadQuestion();
        } else {

        document.getElementById('progressFill').style.width = '100%';

        // Prozentberechnung basierend auf den tatsächlich gesammelten Punkten vs. allen möglichen Punkten
        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>

</body>
</html>
