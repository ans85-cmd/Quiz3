<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK-QUIZ</title>
    <style>
        :root {
            --bg-color: #0b0716;
            --panel-bg: #15102a;
            --neon-pink: #ff2a85;
            --neon-purple: #b537f2;
            --neon-cyan: #00f0ff;
            --neon-green: #00ffaa;
            --neon-red: #ff3366;
            --text-main: #f3f0ff;
            --border-glow: 0 0 15px rgba(181, 55, 242, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at 10% 20%, rgba(181, 55, 242, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 42, 133, 0.1) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 2px solid rgba(181, 55, 242, 0.4);
            box-shadow: var(--border-glow);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .question-meta {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 18px;
            line-height: 1.5;
            color: #fff;
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(25, 18, 48, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--neon-purple);
            background: rgba(181, 55, 242, 0.1);
        }

        .option-btn.selected {
            background: rgba(181, 55, 242, 0.2);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.2);
        }

        /* Feedback Zustände nach Überprüfung */
        .option-btn.correct-ans {
            background: rgba(0, 255, 170, 0.15) !important;
            border-color: var(--neon-green) !important;
            color: #afffdf !important;
        }

        .option-btn.wrong-ans {
            background: rgba(255, 51, 102, 0.15) !important;
            border-color: var(--neon-red) !important;
            color: #ffb3c6 !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border: none;
            color: #fff;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 42, 133, 0.3);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.5);
        }

        .explanation {
            font-size: 0.85rem;
            background: rgba(10, 5, 20, 0.5);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 0 8px 8px 0;
            padding: 12px;
            margin-bottom: 15px;
            color: #d8d4fc;
            line-height: 1.4;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
        }

        .result-score {
            font-size: 2.8rem;
            margin: 15px 0;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .result-status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.4);
        }

        .failed {
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Jenny´s AK-QUIZ</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </header>

    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 15px;">
            Bereit für deine Lernsession?<br>Altklausur AFC WS_24/25.
        </div>
        <p style="font-size: 0.85rem; text-align: center; margin-bottom: 30px; color: #a59fc8; line-height: 1.4;">
            <br>Bestanden ab 75% korrekten Antworten.
        </p>
        <button class="cyber-btn" onclick="startQuiz()">Lernen starten</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
        <div class="question-meta" id="questionCounter">Frage 1 / 40</div>
        <div class="question-text" id="questionText">Lade Frage...</div>
        <div class="options-list" id="optionsList"></div>
        <div class="explanation" id="explanationBox"></div>
        <button class="cyber-btn" id="actionBtn" onclick="handleAction()">Antworten prüfen</button>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen">
        <div class="result-box">
            <h2 style="color: var(--text-main); font-weight: 600;">Auswertung</h2>
            <div class="result-score" id="resultScore">0%</div>
            <div class="result-status" id="resultStatus">Status</div>
            <p id="resultDetails" style="font-size: 0.9rem; margin-bottom: 25px; color: #b8b2e2; line-height: 1.4;"></p>
            <button class="cyber-btn" onclick="restartQuiz()">Nochmal lernen</button>
        </div>
    </div>
</div>

<script>
    const questions = [
     {
  "frage": "Welche der folgenden Beispiele beschreiben Faktoren und/oder Prozesse, die in dem sozial-ökologischen Mehrebenenansatz nach Bronfenbrenner (1979) berücksichtigt werden? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Dynamiken innerhalb virtueller sozialer Netzwerke und deren Einfluss auf die psychische Gesundheit von Individuen.",
  "b": "Einflüsse von urbaner Architektur auf das Gemeinschaftsgefühl in städtischen Nachbarschaften.",
  "c": "Auswirkungen von Schlafmangel auf die kognitive Leistungsfähigkeit des Einzelnen.",
  "d": "Vergleich von pharmakologischen und psychotherapeutischen Behandlungsansätzen bei Depressionen.",
  "e": "Entwicklung von sozialen Normen in Jugendgruppen",
  "richtig": "a, b, e",
  "begruendung": ":-)"
},
{
  "frage": "Welche Aussagen sind hinsichtlich der Grundwerte der Community Psychology zutreffend? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Durch den Wert  individuelles und familiäres Wohlergehen\" wird aus community-psychologischer Perspektive die Ausrichtung von Interventionsmaßnahmen beeinflusst.",
  "b": "Wenn eine Maßnahme sich positiv auf ein Individuum auswirkt, wird dadurch gleichzeitig das Gemeinwohl gefördert.",
  "c": "Der Wert  Respekt vor Diversität\" ist unter anderem notwendig, um die Rechte von Minoritätsgruppen innerhalb der Community zu sichern und zu stärken.",
  "d": "In der Community wird im Kontext der sozialen Gerechtigkeit immer das Bedürfnisprinzip favorisiert.",
  "e": "In einer Community haben Mädchen aufgrund von kulturellen Werten einen eingeschränkten Zugang zu Bildung und gesellschaftlicher Teilhabe. Damit werden bestimmte Gerechtigkeitsprinzipien verletzt und das individuelle Wohlergehen eingeschränkt. Wenn hier eine Abwägung der Werte erfolgt, sollte dies nach dem Erforderlichkeitsprinzip erfolgen.",
  "richtig": "a, c",
  "begruendung": ":-)"
},
{
  "frage": "Welche Aussagen zu den sozial-ökologischen Prinzipien der Community Psychology nach Kelly und Kolleginnen (2000) sind korrekt? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "In einer Stadt organisiert ein Netzwerk von Freiwilligen Lebensmittelspenden, die sie in Zusammenarbeit mit lokalen Geschäften verteilen. Dies ist ein Beispiel für das Prinzip der Zirkulation von Ressourcen.",
  "b": "Ein neues Programm zur Förderung der sozialen Inklusion wird eingeführt. Die Auswirkungen dieses Programms werden über mehrere Jahre hinweg beobachtet, um langfristige Veränderungen in der Gemeinschaft zu analysieren. Dies ist ein Beispiel für das Prinzip der Interdependenz.",
  "c": "Nach einer Naturkatastrophe passt sich eine Gemeinde an die veränderten Umweltbedingungen an, indem sie widerstandsfähigere Bauweisen und Notfallpläne entwickelt. Dies ist ein Beispiel für das Prinzip der Adaptation.",
  "d": "Eine lokale Initiative zur Förderung der Gemeinschaft stellt fest, dass vergangene Versuche, ähnliche Programme zu implementieren, das Vertrauen der Bewohner*innen beeinflussen. Dies ist ein Beispiel für das Prinzip der Sukzession.",
  "e": "Ein Gesundheitsprojekt führt regelmäßig neue Methoden ein, die den aktuellen Bedürfnissen der Zielgruppe angepasst sind. Dies ist ein Beispiel für das Prinzip der Flexibilität.",
  "richtig": "a, c, d",
  "begruendung": ":-)"
},
{
  "frage": "Welche Aussagen über die Identität von Communities sind zutreffend (z. B. Hopkins & Reicher, 1996; Taylor & Whittier, 1994)? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Die Identität einer Community wird von übergeordneten Institutionen festgelegt.",
  "b": "Die Identität einer Community wird von Meinungsführer*innen maßgeblich beeinflusst.",
  "c": "Eine negative Identität/ein negatives Image kann sich negativ auf die Bereitschaft der Mitglieder auswirken, sich für die eigene Community einzusetzen.",
  "d": "Die Identität einer Community ist festgelegt und wird nur selten hinterfragt.",
  "e": "Die Identität einer Community entsteht in einem Aushandlungsprozess, der sowohl innerhalb der Community als auch zwischen der eigenen Community und anderen Gruppen stattfindet.",
  "richtig": "b, c, e",
  "begruendung": ":-)"
},
{
  "frage": "Welche Aussagen zu Ortsbindung und Ortsidentität sind zutreffend? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Die Ortsidentität bezieht sich auf die Beziehung zwischen dem Selbstbild einer Person und den geografischen Orten, an denen sie lebt.",
  "b": "Die Ortsidentität ist eine Substruktur der personalen Identität, die unterschiedliche Kognitionen über eine räumlich-physikalische Umwelt beinhaltet.",
  "c": "Die Ortsbindung bezieht sich darauf, ob eine Person - unabhängig von emotionaler Verbundenheit - durch Verpflichtungen, z. B. Arbeit, an einen Ort gebunden ist.",
  "d": "Die Ortsidentität ist eine vergleichbar statische Größe, die sich nur selten verändert.",
  "e": "Die Ortsidentität ist eine Subdimension des Sense of Community.",
  "richtig": "a, b",
  "begruendung": ":-)"
},
{
  "frage": "Welche Persönlichkeitsvariablen sind nachweislich für die Stressbewältigung relevant? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Kohärenzsinn",
  "b": "Dispositioneller Optimismus",
  "c": "Selbstwirksamkeitserwartung",
  "d": "Verträglichkeit",
  "e": "Kontrollüberzeugung",
  "richtig": "a, b, c, e",
  "begruendung": ":-)"
},
{
  "frage": "Welche der folgenden Aussagen zu familienexternen Ressourcen im Rahmen der familiären Stressbewältigung sind (laut Studienbrief) korrekt? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Andrews et al. (1980) unterscheiden zwischen vier verschiedenen Unterstützungssystemen: formellen, quasi-formellen, informellen und nicht-formellen Unterstützungssystemen.",
  "b": "Unter formellen Unterstützungssystemen werden unter anderem sozialstaatliche Angebote wie Jugendhilfeeinrichtungen verstanden.",
  "c": "Die soziale Unterstützung von Familien kann sowohl positive als auch negative Konsequenzen haben.",
  "d": "Informelle Unterstützungssysteme können in der Regel nur informelle Unterstützung bieten.",
  "e": "Soziale Transferleistungen sind ein Beispiel für materielle Unterstützung.",
  "richtig": "b, c, e",
  "begruendung": ":-)"
},
{
  "frage": "Welche Aussagen zu sozialer Unterstützung im Rahmen kollektiver Identität sind zutreffend? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Soziale Unterstützung kann sich sowohl auf die Veränderung der Ursachen als auch auf die Reduktion der negativen Auswirkungen von Diskriminierung beziehen.",
  "b": "Bei hoher wahrgenommener Veränderbarkeit des Systems wird vor allem die Reduktion der negativen Auswirkungen fokussiert.",
  "c": "Bei niedriger wahrgenommener Wirksamkeit der Gruppe wird darauf fokussiert, die Ursachen der Benachteiligung zu verändern.",
  "d": "Soziale Unterstützung kann auf individueller oder kollektiver Ebene ansetzen.",
  "e": "Niedrige kollektive Identität führt zu höherer sozialer Unterstützung innnerhalb der Gruppe.",
  "richtig": "a, d",
  "begruendung": ":-)"
},
{
  "frage": "Welche Aspekte kennzeichnen den Begriff des Empowerments nach den Definitionen von Rappaport (1987) sowie Wiley und Rappaport (2000)? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Die Kooperation der Akteure ist durch eine prosoziale Haltung gekennzeichnet.",
  "b": "Empowerment ist eine zeitstabile Disposition.",
  "c": "Empowerment wird insbesondere durch individuelle Anstrengungen erreicht.",
  "d": "Empowerment ist intentional.",
  "e": "Das Ziel von Empowerment ist der Zugang zu selbstbestimmter Kontrolle über Ressourcen.",
  "richtig": "a, d, e",
  "begruendung": ":-)"
},
{
  "frage": "Welche der folgenden Sätze geben Beispiele für die Schlüsselprinzipien von Empowerment wieder? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Mitglieder einer marginalisierten Community bilden Arbeitsgruppen, um gemeinsam Strategien zur Lösung spezifischer Probleme in ihrer Nachbarschaft zu entwickeln.",
  "b": "Mitglieder einer Community gründen eine Nachbarschaftsinitiative, um regelmäßige Freizeitaktivitäten für Jugendliche zu organisieren.",
  "c": "Mitglieder einer Community stellen eine Forderung an die lokale Regierung, um Zugang zu besseren Bildungseinrichtungen in ihrem Viertel zu erhalten.",
  "d": "Mitglieder einer Community schaffen ein Netzwerk von Mentor*innen, um jüngeren Mitgliedern bei der Berufsorientierung zu helfen.",
  "e": "Eine politisch engagierte weiße Person setzt sich öffentlich für die Interessen der Schwarzen Community in Deutschland im Rahmen der Black Lives Matter Bewegung ein",
  "richtig": "a, b, c, d",
  "begruendung": ":-)"
},
{
  "frage": "Welche Aussagen zu kritischem politischen Bewusstsein nach Zimmerman (2000) sind zutreffend? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Familiäre Diskussionsfreudigkeit wirkt sich negativ auf die Entwicklung von kritischem politischem Bewusstsein der Kinder aus.",
  "b": "Das Erleben sozialer Benachteiligung führt in der Regel zu kritischem politischem Bewusstsein.",
  "c": "Kritisches politisches Bewusstsein beschreibt den objektiven Einfluss von sozialen, ökonomischen und politischen Faktoren auf die Lebenswirklichkeit innerhalb einer Community.",
  "d": "Kritisches politisches Bewusstsein wird von direkter Kommunikation, nicht jedoch von indirekter Kommunikation beeinflusst.",
  "e": "Familiäre Sozialisationserfahrungen spielen eine wichtige Rolle bei der Entwicklung von kritischem politischem Bewusstsein.",
  "richtig": "b, e",
  "begruendung": ":-)"
},
{
  "frage": "Welche der folgenden Interventionsmaßnahmen zur Förderung von aktiver Partizipation setzen an Prozessen der dritten Stufe des Modells von Klandermans (1997) an? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Steigerung der Identifikation",
  "b": "Frustrationsimpfung",
  "c": "Triangulation",
  "d": "Aufbau und Stärkung von Netzwerken",
  "e": "Bewusstseinsbildung",
  "richtig": "a, b",
  "begruendung": ":-)"
},
{
  "frage": "Nach dem Prozessmodell sozial-politischer Partizipation nach Klandermans (1997) sind sowohl Identifikationsprozesse als auch Kosten-Nutzen Kalkulationsprozesse für die Entwicklung von Teilnahmemotivation entscheiden. Welche der folgenden Beispiele zu diesem Schritt des Modells sind korrekt? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Obwohl sie kein besonderes Interesse am Thema Klimaschutz hat, nimmt Henrike manchmal an Klimaschutzprotesten teil, da viele ihrer Freundinnen sich in dem Bereich engagieren und es negativ auffallen würde, wenn ihr Verhalten sich von dem ihrer Freundinnen unterscheiden würde. Ihre Teilnahmemotivation fällt unter „kollektives Motiv“.",
  "b": "Habibs Freunde finden es beeindruckend, dass er sich letzten Winter bei der Wohnungslosenhilfe engagiert hat. Dies bestärkt ihn darin, sich auch im kommenden Jahr wieder freiwillig zu melden. Seine Motivation aufgrund der Reaktionen seines Umfeldes wird als  normatives Motiv“ bezeichnet.",
  "c": "Torvi nimmt an einem Protest am Internationalen Frauentag teil, weil sie gemeinsam mit ihren Freundinnen den Tag verbringen und das besondere Gemeinschaftsgefühl erleben möchte, das häufig bei derartigen Protesten entsteht. Dieses Motiv wird als  kollektives Motiv“ bezeichnet.",
  "d": "Malik ist seit Jahren an der Organisation von proeuropäischen Demonstrationen beteiligt. Anfangs konnte er persönlich wertvolle Erfahrungen im Bereich Kommunikation sammeln, da er für die Bewerbung der Demonstrationen auf Social Media zuständig war. Mittlerweile kennt er sich in dem Bereich gut aus und lernt wenig Neues, weshalb er die Verantwortung zeitnah an eine andere Person abgegeben möchte. Maliks Motiv wird als  Belohnungsmotiv“ bezeichnet.",
  "e": "Amahle interessiert sich für postkoloniale Theorie, nimmt an Protesten gegen Rassismus teil und setzt sich in einem Integrationsrat für die Bedürfnisse von Migrant*innen in ihrer Nachbarschaft ein, weil sie sich als Aktivistin und Teil einer generationsübergreifenden Bewegung sieht. Ihre Teilnahmemotivation entsteht über einen kollektiven Identifikationsprozess.",
  "richtig": "b, d, e",
  "begruendung": ":-)"
},
{
  "frage": "Community-psychologische Forschung ist in kulturelle Kontexte eingebettet und dementsprechend sollten bestimmte definitorische und methodische Aspekte berücksichtigt werden. Welche der folgenden Aussagen sind in diesem Zusammenhang laut Studienbrief korrekt? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Bei der Erfassung kultureller Identitäten sollte Personen, die an psychologischen Studien teilnehmen, ermöglicht werden anzugeben, dass sie sich mehreren kulturellen Gruppen zugehörig fühlen.",
  "b": "Der Erwerb interkultureller Kompetenzen kann dazu beitragen, dass psychologische Wissenschaftler*innen mögliche Fremdgruppen-Homogenisierung hinterfragen und in ihrem methodischen Vorgehen berücksichtigen.",
  "c": "Ein Großteil der psychologischen Studien, in denen kulturelle Unterschiede zwischen Gruppen erforscht wurden, sind Positivbeispiele für ressourcenorientierte und kulturell sensible Forschung.",
  "d": "Bei der Erfassung kultureller Identitäten kann angenommen werden, dass diese kontextübergreifend das Erleben und Verhalten der Teilnehmenden gleich stark beeinflussen.",
  "e": "Kulturelle Einflüsse auf Antwortverhalten sind bei der Entwicklung neuer psychologischer Messinstrumente zu vernachlässigen, da vergangene Methodenforschung nur minimale Einflüsse aufgezeigt hat.",
  "richtig": "a, b",
  "begruendung": ":-)"
},
{
  "frage": "Sie führen ein community-psychologisches Forschungsprojekt zur kulturellen und ethnischen Identität von Einwander*innen in Deutschland durch. Dafür interviewen Sie eine junge Frau namens Liya, welche vor einigen Jahren mit ihren Eltern von Eritrea nach Deutschland gezogen ist. Sie wollen erfahren, wie sehr sie sich welcher Kultur oder Ethnie zugehörig fühlt und greifen dabei auf die vier Komponenten der ethnischen Identität nach Phinney (1990) zurück. Welche Aussagen sind in diesem Zusammenhang zutreffend? Wählen Sie für alle Aussagen entweder, Richtig' oder, Falsch'.",
  "a": "Liya berichtet viel über die Geschichte Eritreas und scheint sich sehr gut damit auszukennen. Dies ist an Beispiel für ethnische Identifikation.",
  "b": "Liya erzählt, dass sie mit vielen Einwander*innen aus Eritrea befreundet ist, und findet, dass Menschen aus Eritrea meistens freundlich, offen und herzlich seien. Dies ist ein Beispiel für eine positive ethnische Einstellung.",
  "c": "Liya erzählt, dass sie sehr stolz auf ihre eritreischen Wurzeln ist. Dies ist ein Beispiel für ein hohes ethnisches Bewusstsein.",
  "d": "Liya spricht weder arabisch noch Tigrinya (Amtssprachen in Eritrea). Dies spricht für eine geringe ethnische Identifikation.",
  "e": "Liya kocht sehr gern eritreisches Essen. Dies ist ein Beispiel für ethnische Verhaltensweisen.",
  "richtig": "b, e",
  "begruendung": ":-)"

    let currentQuestionIndex = 0;

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        // Berechne vorab die insgesamt erreichbaren Punkte im gesamten Quiz
        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                // Wenn richtig angekreuzt wurde, geben wir einen Punkt dazu

                    score += 1;
                }
            } else {
                if (isSelected) {

                }
            }
        });

        // Begründung anzeigen
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        // Button-Text auf "Weiter" ändern
        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        // Prozentberechnung basierend auf den tatsächlich gesammelten Punkten vs. allen möglichen Punkten
        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>

</html>
