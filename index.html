<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Jenny's AFC Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #fbd3e9, #fdfbfb);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  color: #6b2f4d;
}

/* HEADER */
header {
  text-align: center;
  margin-bottom: 20px;
}

.logo {
  font-size: 3rem;
}

h1 {
  color: #a94a78;
  margin: 10px 0;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 420px;
}

/* 💖 BARBIE BUTTON STYLE */
.card {
  background: linear-gradient(145deg, #ff9ec4, #ff6fa3);
  border-radius: 18px;
  padding: 18px 10px;
  text-align: center;
  text-decoration: none;
  color: white;
  font-weight: 600;
  box-shadow: 0 8px 20px rgba(255, 105, 160, 0.35);
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(255, 105, 160, 0.5);
}

.card:active {
  transform: scale(0.96);
}

/* große Karte unten */
.card.special {
  grid-column: span 2;
  background: linear-gradient(145deg, #ff7bac, #ff4f93);
}

/* FOOTER */
footer {
  margin-top: 30px;
  text-align: center;
  font-size: 0.9rem;
}

footer a {
  color: #d63384;
  text-decoration: none;
  font-weight: bold;
}

footer a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>
