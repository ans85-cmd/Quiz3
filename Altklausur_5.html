<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK-QUIZ</title>
    <style>
        :root {
            --bg-color: #0b0716;
            --panel-bg: #15102a;
            --neon-pink: #ff2a85;
            --neon-purple: #b537f2;
            --neon-cyan: #00f0ff;
            --neon-green: #00ffaa;
            --neon-red: #ff3366;
            --text-main: #f3f0ff;
            --border-glow: 0 0 15px rgba(181, 55, 242, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-image: radial-gradient(circle at 10% 20%, rgba(181, 55, 242, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 42, 133, 0.1) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 2px solid rgba(181, 55, 242, 0.4);
            box-shadow: var(--border-glow);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.3rem;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .question-meta {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 18px;
            line-height: 1.5;
            color: #fff;
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(25, 18, 48, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--neon-purple);
            background: rgba(181, 55, 242, 0.1);
        }

        .option-btn.selected {
            background: rgba(181, 55, 242, 0.2);
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.2);
        }

        /* Feedback Zustände nach Überprüfung */
        .option-btn.correct-ans {
            background: rgba(0, 255, 170, 0.15) !important;
            border-color: var(--neon-green) !important;
            color: #afffdf !important;
        }

        .option-btn.wrong-ans {
            background: rgba(255, 51, 102, 0.15) !important;
            border-color: var(--neon-red) !important;
            color: #ffb3c6 !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border: none;
            color: #fff;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 42, 133, 0.3);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.5);
        }

        .explanation {
            font-size: 0.85rem;
            background: rgba(10, 5, 20, 0.5);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 0 8px 8px 0;
            padding: 12px;
            margin-bottom: 15px;
            color: #d8d4fc;
            line-height: 1.4;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
        }

        .result-score {
            font-size: 2.8rem;
            margin: 15px 0;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .result-status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.4);
        }

        .failed {
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Jenny´s AK-QUIZ</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </header>

    <!-- Start Screen -->
    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 15px;">
            Bereit für deine Lernsession?<br>Altklausur AFC WS_23/24.
        </div>
        <p style="font-size: 0.85rem; text-align: center; margin-bottom: 30px; color: #a59fc8; line-height: 1.4;">
            <br>Bestanden ab 75% korrekten Antworten.
        </p>
        <button class="cyber-btn" onclick="startQuiz()">Lernen starten</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
        <div class="question-meta" id="questionCounter">Frage 1 / 40</div>
        <div class="question-text" id="questionText">Lade Frage...</div>
        <div class="options-list" id="optionsList"></div>
        <div class="explanation" id="explanationBox"></div>
        <button class="cyber-btn" id="actionBtn" onclick="handleAction()">Antworten prüfen</button>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen">
        <div class="result-box">
            <h2 style="color: var(--text-main); font-weight: 600;">Auswertung</h2>
            <div class="result-score" id="resultScore">0%</div>
            <div class="result-status" id="resultStatus">Status</div>
            <p id="resultDetails" style="font-size: 0.9rem; margin-bottom: 25px; color: #b8b2e2; line-height: 1.4;"></p>
            <button class="cyber-btn" onclick="restartQuiz()">Nochmal lernen</button>
        </div>
    </div>
</div>

<script>
    const questions = [
{
  "frage": "Welche der folgenden Beispiele beschreiben Faktoren und/oder Prozesse, die in dem sozial-ökologischen Mehrebenenansatz nach Bronfenbrenner (1979) berücksichtigt werden?",
  "a": "Entstehung von Gemeinschaftsgefühl innerhalb einer Schulklasse.",
  "b": "Auswirkungen rechtlicher Veränderungen auf Einstellungen gegenüber marginalisierten Gruppen.",
  "c": "Vergleiche individueller körperlicher Stressreaktionen.",
  "d": "Auswirkungen medialer Darstellungen von Personengruppen auf deren Diskriminierung.",
  "e": "Einflüsse von lokalen Gemeindezusammenschlüssen auf den Sense of Community der Einwohner:innen.",
  "richtig": "a, b, d, e",
  "begruendung": "Der sozial-ökologische Mehrebenenansatz nach Bronfenbrenner berücksichtigt übergeordnete Kontexte wie Gesetze (Makrosystem), Medien und lokale Gemeinschaften."
},
{
  "frage": "Die Community Psychology setzt besondere Akzente im Hinblick auf den Forschungs- und Interventionsprozess. Welche der folgenden Aussagen bezüglich dieser Akzentuierung sind korrekt?",
  "a": "Forschung sollte die Perspektiven der Mitglieder der Communities, über die geforscht wird, mit einbeziehen.",
  "b": "Insbesondere bei Interventionen ist es wichtig, dass die Wissenschaftler:innen mit ihrer Expertise die Rahmenbedingungen vorgeben und die Entscheidungshoheit bezüglich der Vorgehensweise behalten.",
  "c": "Der Fokus liegt auf den Ressourcen einzelner Individuen, Gruppen und Communities und ihrer Förderung.",
  "d": "Die Community Psychology setzt in Interventionen stärker auf (primäre) Prävention und Förderung als auf Therapie und Rehabilitation.",
  "e": "Community-psychologische Intervention ist typischerweise interdisziplinär orientiert.",
  "richtig": "a, c, d, e",
  "begruendung": "Community Psychology betont Partizipation, Ressourcenorientierung, Prävention und interdisziplinäres Arbeiten statt top-down Expertentum."
},
{
  "frage": "Welche Merkmale machen lokal administrative Communities nach Bronfenbrenner (1979) aus?",
  "a": "Direkte Kontaktmöglichkeiten",
  "b": "Wahrgenommene Ähnlichkeiten auf sozial bedeutsamen Dimensionen",
  "c": "Soziale Kategorisierung",
  "d": "Selbststereotypisierung",
  "e": "Geografische Nähe",
  "richtig": "a, e",
  "begruendung": "Lokal administrative Communities zeichnen sich primär durch geografische Nähe und direkte Kontaktmöglichkeiten aus."
},
{
  "frage": "Die Konzeption des Sense of Community nach McMillan und Chavis (1986) verweist auf mehrere Komponenten dieses Konstrukts. Welche gehören dazu?",
  "a": "Emotionale Verbundenheit",
  "b": "Erfolg",
  "c": "Vermächtnis",
  "d": "Ortsidentität",
  "e": "Mitgliedschaft",
  "richtig": "a, e",
  "begruendung": "Die vier Komponenten des Sense of Community nach McMillan und Chavis sind Mitgliedschaft (membership), Einfluss (influence), Integration und Erfüllung von Bedürfnissen sowie gemeinsame emotionale Verbundenheit (shared emotional connection)."
},
{
  "frage": "Zeidner und Saklofske (1996) schlagen acht Kriterien vor, anhand derer sich funktionales von dysfunktionalem Coping unterscheiden lässt. Welche gehören dazu?",
  "a": "Ausmaß der Steigerung des subjektiven Wohlbefindens",
  "b": "Ausmaß der Steigerung des Wohlbefindens des unmittelbaren sozialen Umfelds",
  "c": "Ausmaß der Aufrechterhaltung positiven Selbstwerts",
  "d": "Grad der Reduktion negativen Stresserlebens",
  "e": "Umfang der Wiederherstellung sozialer Funktionsfähigkeit",
  "richtig": "a, b, c, d, e",
  "begruendung": "Funktionales Coping fördert das subjektive Wohlbefinden, den Selbstwert, reduziert negatives Stresserleben und stellt soziale Funktionsfähigkeit wieder her (das Wohlbefinden des unmittelbaren sozialen Umfelds gehört nicht zu den acht Kriterien)."
},
{
  "frage": "Welche der folgenden Aussagen zur juristischen, familienpolitischen und psychologischen Sichtweise auf Familien sind korrekt?",
  "a": "In der konservativen Rechtsauffassung wird Familie mit Ehegemeinschaft mit Kindern gleichgesetzt.",
  "b": "Aus familienpsychologischer Perspektive ist Familie durch das Aufeinandertreffen von Generationen geprägt.",
  "c": "Adoptiv- und Pflegefamilien fallen in der familienpsychologischen Begriffsdefinition unter nicht-traditionelle familiäre Lebensformen.",
  "d": "Im juristischen Verständnis des Familienbegriffs werden heutzutage viele verschiedene soziale Konstellationen als Familie anerkannt und entsprechend in den Rechtsnormen berücksichtigt.",
  "e": "Die Struktur der Familie ist in den vergangenen zwei Jahrhunderten gleichgeblieben und hat sich erst in den letzten zwei Jahrzehnten grundlegend verändert.",
  "richtig": "a, b, c, d",
  "begruendung": "Die Familienstruktur hat sich über längere Zeiträume gewandelt; die anderen Aussagen geben die konservative Rechtsauffassung, familienpsychologische Perspektiven zu Generationen und nicht-traditionellen Formen sowie moderne juristische Anerkennung korrekt wieder."
},
{
  "frage": "Welche Aussagen zum Circumplexmodell von Olsen (2000) sind zutreffend?",
  "a": "Es wird angenommen, dass eine gleichzeitige hohe Ausprägung auf allen Dimensionen des Modells für ein gutes Funktionieren der Familie optimal ist.",
  "b": "Losgelöst bezeichnet eine mögliche Stufe der Familienkohäsion.",
  "c": "Es lassen sich durch das Modell aufgrund der verschiedenen Ausprägungen auf den Dimensionen Kohäsion und Adaptabilität insgesamt 12 Familientypen unterscheiden.",
  "d": "Strukturiert bezeichnet eine mögliche Stufe der Familienadaptabilität.",
  "e": "Familienkohäsion bezieht sich auf die Fähigkeit einer Familie, bestehende Rollen- und Beziehungsregeln in Abhängigkeit von Belastungen zu verändern.",
  "richtig": "b, d",
  "begruendung": "Losgelöst (detached) ist eine Stufe der Kohäsion und strukturiert eine Stufe der Adaptabilität im Circumplexmodell. Die anderen Aussagen sind inhaltlich falsch (z.B. bezieht sich Adaptabilität auf Regelveränderungen, und es werden 16 Familientypen unterschieden)."
},
{
  "frage": "In einer Kleinstadt gibt es zwei Schulen: eine staatliche und eine private... Welche der folgenden Beispiele gelten in diesem Kontext laut dem sozialen Identitätsansatz von Tajfel und Turner (1979) als Strategien sozialer Kreativität?",
  "a": "Die Schülerinnen der staatlichen Schule erhielten Anerkennung beim Bundeswettbewerb Fremdsprachen für ihre äußerst kreativen Darbietungen. Dementsprechend rücken sie ihre Leistungen in dieser künstlerischen Dimension in den Vordergrund, anstatt einen Vergleich mit den Schüler:innen der Privatschule hinsichtlich ihrer Englisch- und Französischkenntnisse zu betonen.",
  "b": "Die Schüler:innen der staatlichen Schule bewerten englische und französische Fremdsprachenkenntnisse als unwichtig.",
  "c": "Schülerinnen der staatlichen Schule wechseln auf die private Schule.",
  "d": "Die Schüler:innen der staatlichen Schule starten Proteste und fordern mehr finanzielle Ressourcen für ihre Schule.",
  "e": "Die Schüler:innen der staatlichen Schule vergleichen ihre englischen und französischen Fremdsprachenkenntnisse mit denen von Schüler:innen aus einer staatlichen Schule der Nachbarstadt und kommen zu dem Schluss, dass sie bessere Sprachkenntnisse haben als die Schülerinnen dort.",
  "richtig": "a, b, e",
  "begruendung": "Soziale Kreativität liegt vor, wenn eine benachteiligte Gruppe eine neue Vergleichsdimension wählt oder den Vergleichswert umwertet (Dimensionenwechsel). Options c ist sozialer Mobilitätswechsel, d ist sozialer Wettbewerb, e ist ein Vergleich mit einer anderen Outgroup (Ausweichen/Vergleichsänderung auf andere Outgroup, aber Kreativität bezieht sich spezifisch auf die Neudefinition der Dimension wie in a)."
},
{
  "frage": "Welche der folgenden Aussagen stehen im Einklang mit der community-psychologischen Auffassung von Empowerment?",
  "a": "Empowerment ist ein Prozess.",
  "b": "Empowerment ist unabhängig von gesellschaftlichen Machtfragen.",
  "c": "Das Ziel von Empowerment ist der Zugang zu selbstbestimmter Kontrolle über Ressourcen.",
  "d": "Empowerment ist eine zeitstabile Disposition.",
  "e": "Empowerment bezieht sich ausschließlich auf Individuen.",
  "richtig": "a, c",
  "begruendung": "Empowerment ist ein dynamischer Prozess und zielt auf Kontrolle über Ressourcen ab. Es ist weder unabhängig von Machtfragen noch eine stabile Disposition oder nur auf Individuen beschränkt (sondern auch Gruppen und Communities)."
},
{
  "frage": "Welche der folgenden Aussagen zum Begriff der Macht sind laut Studienbrief korrekt?",
  "a": "Es wird zwischen drei Formen der Macht unterschieden (z. B. Hollander & Offermann, 1990; Rudkin, 2003): Macht über (power over), Macht zu (power to) und Macht wegen (power due to).",
  "b": "Präventions- oder Interventionsziele community-psychologischer Maßnahmen unterscheiden sich je nach Form der Macht, welche bei den zu empowernden Personen gestärkt werden soll.",
  "c": "Im Rahmen einer community-psychologischen Intervention sollten immer alle Machtmittel/Machtgrundlagen gleichmäßig gestärkt und ausgebaut werden.",
  "d": "Eine Quelle von Identifikationsmacht ist das Charisma der machthabenden Person.",
  "e": "Im Rahmen von Empowerment ist es eine wichtige Grundlage, Community-Mitglieder für Fragen der Machtausübung zu sensibilisieren.",
  "richtig": "b, d, e",
  "begruendung": "Machtformen (power over, power to, power with etc., bzw. die Unterscheidungen im Studienbrief) bedingen unterschiedliche Interventionsziele, Identifikationsmacht basiert auf Charisma/Vorbildwirkung, und Sensibilisierung für Macht ist zentral."
},
{
  "frage": "Welche der folgenden Aussagen zu partizipatorischen Kompetenzen sind korrekt (vgl. z. B. Berkowitz, 2000)?",
  "a": "Aktives sozial-politisches Engagement führt häufig zu einem Zugewinn an partizipatorischen Kompetenzen.",
  "b": "Vorhandene Strukturen zur Zielerreichung weiterzuentwickeln fällt unter die Kategorie organisatorische Kompetenz.",
  "c": "Alle partizipatorischen Kompetenzen sind für die individuelle Beteiligung in der Regel gleich wichtig.",
  "d": "Die Fähigkeit Probleme zu identifizieren und dafür Lösungsmöglichkeiten zu entwickeln fällt unter die Kategorie organisatorische Kompetenz.",
  "e": "Die Fähigkeit unterschiedliche Bedürfnislagen und Perspektiven beteiligter Personen wahrzunehmen und entsprechend angepasste Entscheidungsprozesse abzustimmen fällt unter die Kategorie assimilative Kompetenz.",
  "richtig": "a, b",
  "begruendung": "Aktives Engagement fördert partizipatorische Kompetenzen, und die Weiterentwicklung von Strukturen gehört zur organisatorischen Kompetenz."
},
{
  "frage": "Monatelang hielten Klima-Aktivist:innen das Dorf Lützerath besetzt... Welche der folgenden genannten Faktoren und Prozesse sind vereinbar mit dem Prozessmodell sozial-politischer Partizipation nach Klandermans (1997)?",
  "a": "Anna hat von zwei Freundinnen von den Aktionen in Lützerath gehört und sich entschlossen die beiden in das Dorf zu begleiten. Ihr ist das Thema Klimawandel nicht besonders wichtig, da sie nicht davon ausgeht, dass es irgendeine Auswirkung auf ihr Leben haben wird. Sie liebt jedoch Abenteuer und die Auszeit von ihrem Studium kommt ihr gelegen.",
  "b": "Moritz ärgert sich sehr über die globalen Ungerechtigkeiten, die mit dem Klimawandel verbunden sind. Er ist daher mit einer Gruppe von Aktivist:innen nach Lützerath gereist, obwohl er denkt, dass solche Aktionen generell keine Wirkung haben.",
  "c": "Erst hatte Miriam kein Interesse an dem Thema Umweltschutz. Als sie jedoch in der Uni mit einer Aktivistin ins Gespräch kam, bekam das Thema für sie eine hohe Wichtigkeit. Sie erwog, nach Lützerath zu reisen, sah aber letztlich davon ab, da sie sich zu der Zeit auf eine wichtige Prüfung vorbereiten musste.",
  "d": "Tino ist sich der Probleme, die durch den Klimawandel entstehen, bewusst. Er verbreitet auf sozialen Medien Informationen zu Aktionen und hofft, dass genügend Menschen daran teilnehmen und sich weiter engagieren. Er selbst möchte nicht aktiv vor Ort teilnehmen, da er aufgrund einer Angststörung die Reise nach Lützerath und die Proteste vor Ort als zu herausfordernd einstuft.",
  "e": "Carsten interessiert sich sehr für den Umweltschutz und hat sich umfassend informiert. Nach gründlicher Abwägung hat er beschlossen, nicht nach Lützerath zu reisen, da er den Nutzen der Aktion für das Klima als gering einstufte. Stattdessen hat er sich einer Bewegung angeschlossen, die sich zum Ziel gesetzt hat, den Ausbau der Windkraft zu beschleunigen.",
  "richtig": "c, d, e",
  "begruendung": "Nach Klandermans spielen Motive (kollektives Motiv, kollektive Identifikation, Kosten-Nutzen-Kalkül) eine Rolle. Miriams, Tinos und Carstens Szenarien bilden realistische Abwägungen bzw. Barrieren ab."
},
{
  "frage": "Nach dem Prozessmodell sozial-politischer Partizipation nach Klandermans (1997) sind sowohl Identifikationsprozesse als auch Kosten-Nutzen Kalkulationsprozesse für die Entwicklung von Teilnahmemotivation entscheidend. Welche der folgenden Aussagen zu diesem Schritt des Modells sind korrekt?",
  "a": "Das kollektive Motiv der Kosten-Nutzen Kalkulationsprozesse bezieht sich auf die von den anderen Teilnehmenden (Kollektiv) erwarteten Kosten und Nutzen der Teilnahme, z. B. durch negative Reaktionen anderer auf die eigene Teilnahme.",
  "b": "Die drei Motive der Kosten-Nutzen Kalkulationsprozesse und ihre Bedeutung für die Bereitschaft zu sozialem Engagement wurden bisher noch nicht ausreichend erforscht oder empirisch belegt.",
  "c": "Das Vermeidungsmotiv beschreibt die Vermeidung eigener Bemühungen partizipativ an der Bewegung teilzunehmen und stattdessen von den anderen in Form von sozialem Trittbrettfahren zu profitieren.",
  "d": "Identifikationsprozesse spielen neben der Motivation eine wichtige Rolle für das aktive Einsetzen zur Erreichung kollektiver Ziele.",
  "e": "Zugehörigkeit zu einer sozialen Gruppe und deren Bedeutung für die eigene Identität sind die zwei Aspekte von kollektiver Identifikation.",
  "richtig": "d, e",
  "begruendung": "Das Trittbrettfahrer-Motiv (Vermeidung eigener Anstrengungen bei Profitieren von kollektivem Erfolg), die Rolle von Identifikationsprozessen und die zwei Aspekte kollektiver Identifikation (Zugehörigkeit und Bedeutsamkeit) sind Kernelemente des Modells."
},
{
  "frage": "Mit welchen Themen bzw. Aspekten sollten sich Community-Psycholog:innen laut Dalton et al. (2007) vor der Initiierung von Forschungs- und Interventionsprojekten zu community-psychologischen Fragestellungen auseinandersetzen?",
  "a": "Sie sollten ihr persönliches Wissenschaftsverständnis und die zugrundeliegenden Werte reflektieren.",
  "b": "Sie sollten überlegen, auf welchen Wegen die Mitglieder der Community an der Forschung beteiligt werden können und wie Vertrauen zwischen ihnen und den Wissenschaftler:innen aufgebaut werden kann.",
  "c": "Sie sollten ihren eigenen kulturellen Hintergrund reflektieren und überlegen, wie er die Forschung oder Intervention beeinflussen könnte und entsprechend berücksichtigt werden muss.",
  "d": "Sie sollten sich überlegen, auf welche sozial-ökologische Ebene sich die Forschung oder Intervention beziehen sollte.",

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        // Buttons sperren und Auswertung anzeigen
        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                // Wenn richtig angekreuzt wurde, geben wir einen Punkt dazu
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        // Begründung anzeigen
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        // Button-Text auf "Weiter" ändern
        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        // Prozentberechnung basierend auf den tatsächlich gesammelten Punkten vs. allen möglichen Punkten
        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>
